<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const BusinessCardManager = () => {
            const [cardImage, setCardImage] = useState(null);
            const [formData, setFormData] = useState({
                companyName: '',
                name: '',
                designation: '',
                email: '',
                phone1: '',
                phone2: '',
                website: '',
                additionalInfo: '',
            });
            const [savedCards, setSavedCards] = useState([]);
            const [editingId, setEditingId] = useState(null);
            const [isExtracting, setIsExtracting] = useState(false);
            const [extractError, setExtractError] = useState('');
            const [isLoadingCards, setIsLoadingCards] = useState(true);
            const [isSaving, setIsSaving] = useState(false);
            const fileInputRef = useRef(null);

            useEffect(() => {
                loadSavedCards();
            }, []);

            const loadSavedCards = async () => {
                setIsLoadingCards(true);
                try {
                    const response = await fetch('/api/cards');
                    const data = await response.json();
                    setSavedCards(data.cards || []);
                } catch (e) {
                    console.error('Error loading saved cards:', e);
                } finally {
                    setIsLoadingCards(false);
                }
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    setCardImage(event.target.result);
                    extractTextFromCard(file);
                };
                reader.readAsDataURL(file);
            };

            const extractTextFromCard = async (file) => {
                setIsExtracting(true);
                setExtractError('');
                try {
                    const body = new FormData();
                    body.append('file', file);
                    body.append('apikey', 'helloworld');
                    body.append('language', 'eng');
                    body.append('isOverlayRequired', 'false');
                    body.append('OCREngine', '2');
                    body.append('scale', 'true');
                    body.append('detectOrientation', 'true');

                    const response = await fetch('https://api.ocr.space/parse/image', {
                        method: 'POST',
                        body: body
                    });

                    const result = await response.json();

                    if (result.IsErroredOnProcessing) {
                        setExtractError(result.ErrorMessage?.[0] || 'OCR failed. Please fill in manually.');
                        return;
                    }

                    const parsedText = result.ParsedResults?.[0]?.ParsedText || '';
                    if (!parsedText.trim()) {
                        setExtractError('No text detected. Please fill in manually.');
                        return;
                    }

                    parseBusinessCardText(parsedText);
                } catch (error) {
                    console.error('OCR error:', error);
                    setExtractError('Could not reach OCR service. Please fill in manually.');
                } finally {
                    setIsExtracting(false);
                }
            };

            const parseBusinessCardText = (text) => {
                const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 1);
                const updated = { companyName: '', name: '', designation: '', email: '', phone1: '', phone2: '', website: '', additionalInfo: '' };
                const usedLines = new Set();

                lines.forEach((line, idx) => {
                    const emailMatch = line.match(/[\w.+-]+@[\w-]+\.[\w.-]+/);
                    if (emailMatch && !updated.email) {
                        updated.email = emailMatch[0];
                        usedLines.add(idx);
                    }
                });

                lines.forEach((line, idx) => {
                    if (usedLines.has(idx)) return;
                    const phoneMatch = line.match(/(\+?\d[\d\s\-().]{7,}\d)/);
                    if (phoneMatch) {
                        const cleaned = phoneMatch[0].trim();
                        if (!updated.phone1) {
                            updated.phone1 = cleaned;
                            usedLines.add(idx);
                        } else if (!updated.phone2) {
                            updated.phone2 = cleaned;
                            usedLines.add(idx);
                        }
                    }
                });

                lines.forEach((line, idx) => {
                    if (usedLines.has(idx)) return;
                    const lower = line.toLowerCase();
                    const urlMatch = line.match(/((https?:\/\/)?(www\.)?[\w-]+\.(com|co\.in|co\.uk|io|org|net|in)[\w\/.-]*)/i);
                    if (urlMatch && !updated.website && !lower.includes('@')) {
                        updated.website = urlMatch[0];
                        usedLines.add(idx);
                    }
                });

                const designationKeywords = ['director', 'founder', 'ceo', 'cto', 'cfo', 'coo', 'manager', 'president', 'head', 'engineer', 'consultant', 'executive', 'officer', 'lead', 'vp', 'owner'];
                let designationIdx = -1;
                lines.forEach((line, idx) => {
                    if (usedLines.has(idx)) return;
                    const lower = line.toLowerCase();
                    if (!updated.designation && designationKeywords.some(k => lower.includes(k)) && line.length < 60) {
                        updated.designation = line;
                        designationIdx = idx;
                        usedLines.add(idx);
                    }
                });

                const companyKeywords = ['systems', 'solutions', 'technologies', 'services', 'pvt', 'ltd', 'inc', 'llc', 'corp', 'infosystems', 'enterprises', 'group'];
                lines.forEach((line, idx) => {
                    if (usedLines.has(idx)) return;
                    const lower = line.toLowerCase();
                    if (!updated.companyName && companyKeywords.some(k => lower.includes(k)) && line.length < 80) {
                        updated.companyName = line;
                        usedLines.add(idx);
                    }
                });

                // Slogans/taglines commonly sit right under the company name - filter these out of name candidates
                const sloganWords = ['enabling', 'empowering', 'success', 'through', 'knowledge', 'innovat', 'solutions for', 'delivering', 'driving', 'transform', 'excellence', 'partner', 'your trusted', 'leading provider'];
                const looksLikeSlogan = (line) => {
                    const lower = line.toLowerCase();
                    return sloganWords.some(w => lower.includes(w)) || line.split(' ').length > 5;
                };

                // Best signal: the line immediately above the designation is usually the person's name
                if (!updated.name && designationIdx > 0) {
                    const candidate = lines[designationIdx - 1];
                    if (candidate && !usedLines.has(designationIdx - 1) && !looksLikeSlogan(candidate) && candidate.length < 50) {
                        updated.name = candidate;
                        usedLines.add(designationIdx - 1);
                    }
                }

                // Fallback: first remaining line that doesn't look like a slogan
                if (!updated.name) {
                    const nameIdx = lines.findIndex((line, idx) => !usedLines.has(idx) && line.length < 50 && !looksLikeSlogan(line));
                    if (nameIdx !== -1) {
                        updated.name = lines[nameIdx];
                        usedLines.add(nameIdx);
                    }
                }

                const leftover = lines.filter((line, idx) => !usedLines.has(idx)).join(', ');
                if (leftover) {
                    updated.additionalInfo = leftover;
                }

                setFormData(prev => ({
                    ...prev,
                    ...Object.fromEntries(Object.entries(updated).filter(([k, v]) => v))
                }));
            };

            const handleFormChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleSave = async () => {
                if (!formData.name) {
                    alert('Please enter at least a name');
                    return;
                }

                const card = {
                    id: editingId || Date.now(),
                    image: cardImage,
                    ...formData,
                };

                setIsSaving(true);
                try {
                    const response = await fetch('/api/cards', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(card)
                    });

                    if (!response.ok) {
                        throw new Error('Save failed');
                    }

                    alert(editingId ? 'Business card updated!' : 'Business card saved!');
                    setEditingId(null);
                    resetForm();
                    await loadSavedCards();
                } catch (e) {
                    console.error('Error saving card:', e);
                    alert('Could not save to database. Please try again.');
                } finally {
                    setIsSaving(false);
                }
            };

            const handleLoadCard = (card) => {
                setCardImage(card.image);
                setFormData({
                    companyName: card.companyName,
                    name: card.name,
                    designation: card.designation,
                    email: card.email,
                    phone1: card.phone1,
                    phone2: card.phone2,
                    website: card.website,
                    additionalInfo: card.additionalInfo,
                });
                setEditingId(card.id);
                window.scrollTo(0, 0);
            };

            const handleDelete = async (id) => {
                if (!confirm('Are you sure?')) return;
                try {
                    const response = await fetch('/api/cards?id=' + id, { method: 'DELETE' });
                    if (!response.ok) throw new Error('Delete failed');
                    await loadSavedCards();
                } catch (e) {
                    console.error('Error deleting card:', e);
                    alert('Could not delete from database. Please try again.');
                }
            };

            const resetForm = () => {
                setCardImage(null);
                setEditingId(null);
                setExtractError('');
                setFormData({
                    companyName: '',
                    name: '',
                    designation: '',
                    email: '',
                    phone1: '',
                    phone2: '',
                    website: '',
                    additionalInfo: '',
                });
                if (fileInputRef.current) {
                    fileInputRef.current.value = '';
                }
            };

            return (
                <div className="min-h-screen bg-gray-100">
                    <div className="bg-white shadow">
                        <div className="max-w-7xl mx-auto px-4 py-6">
                            <h1 className="text-4xl font-bold text-gray-900">📇 Business Card Manager</h1>
                            <p className="text-gray-600 mt-1">Collect, organize, and manage business cards</p>
                        </div>
                    </div>

                    <div className="max-w-7xl mx-auto px-4 py-8">
                        <div className="grid grid-cols-1 lg:grid-cols-5 gap-6">
                            <div className="lg:col-span-1">
                                <div className="bg-white rounded-lg shadow-lg p-6 h-full">
                                    <h2 className="text-lg font-bold text-gray-900 mb-4">Card Image</h2>

                                    {isExtracting && (
                                        <div className="mb-3 bg-blue-100 border border-blue-300 rounded-lg p-3 text-center">
                                            <p className="text-sm font-medium text-blue-700">🔍 Extracting text from card...</p>
                                        </div>
                                    )}

                                    {extractError && !isExtracting && (
                                        <div className="mb-3 bg-yellow-100 border border-yellow-300 rounded-lg p-3 text-center">
                                            <p className="text-xs font-medium text-yellow-800">⚠️ {extractError}</p>
                                        </div>
                                    )}

                                    <div
                                        onClick={() => fileInputRef.current?.click()}
                                        className="border-2 border-dashed border-blue-300 rounded-lg p-4 text-center cursor-pointer hover:border-blue-500 hover:bg-blue-50 transition bg-blue-50"
                                    >
                                        {cardImage ? (
                                            <div className="space-y-3">
                                                <img src={cardImage} alt="Business Card" className="w-full h-auto rounded" />
                                                <button
                                                    type="button"
                                                    onClick={(e) => {
                                                        e.stopPropagation();
                                                        setCardImage(null);
                                                    }}
                                                    className="w-full bg-red-500 text-white px-3 py-2 rounded hover:bg-red-600 text-sm font-medium"
                                                >
                                                    Remove
                                                </button>
                                            </div>
                                        ) : (
                                            <div className="py-8">
                                                <svg className="mx-auto h-12 w-12 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />
                                                </svg>
                                                <p className="mt-2 text-sm font-medium text-gray-700">Click to upload</p>
                                                <p className="text-xs text-gray-500">Card image</p>
                                            </div>
                                        )}
                                    </div>

                                    <input
                                        ref={fileInputRef}
                                        type="file"
                                        accept="image/*"
                                        onChange={handleImageUpload}
                                        className="hidden"
                                    />
                                </div>
                            </div>

                            <div className="lg:col-span-4">
                                <div className="bg-white rounded-lg shadow-lg p-8">
                                    <h2 className="text-2xl font-bold text-gray-900 mb-6">Card Details</h2>

                                    <div className="space-y-5">
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm font-semibold text-gray-700 mb-2">Name *</label>
                                                <input
                                                    type="text"
                                                    name="name"
                                                    value={formData.name}
                                                    onChange={handleFormChange}
                                                    placeholder="Full name"
                                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-semibold text-gray-700 mb-2">Designation</label>
                                                <input
                                                    type="text"
                                                    name="designation"
                                                    value={formData.designation}
                                                    onChange={handleFormChange}
                                                    placeholder="Job title"
                                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                />
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">Company Name</label>
                                            <input
                                                type="text"
                                                name="companyName"
                                                value={formData.companyName}
                                                onChange={handleFormChange}
                                                placeholder="Company name"
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">Email</label>
                                            <input
                                                type="email"
                                                name="email"
                                                value={formData.email}
                                                onChange={handleFormChange}
                                                placeholder="email@company.com"
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                            />
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm font-semibold text-gray-700 mb-2">Phone 1</label>
                                                <input
                                                    type="tel"
                                                    name="phone1"
                                                    value={formData.phone1}
                                                    onChange={handleFormChange}
                                                    placeholder="+1 (555) 123-4567"
                                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-semibold text-gray-700 mb-2">Phone 2</label>
                                                <input
                                                    type="tel"
                                                    name="phone2"
                                                    value={formData.phone2}
                                                    onChange={handleFormChange}
                                                    placeholder="Optional"
                                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                />
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">Website</label>
                                            <input
                                                type="url"
                                                name="website"
                                                value={formData.website}
                                                onChange={handleFormChange}
                                                placeholder="www.company.com"
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">Additional Info</label>
                                            <textarea
                                                name="additionalInfo"
                                                value={formData.additionalInfo}
                                                onChange={handleFormChange}
                                                placeholder="Services, specializations, notes..."
                                                rows="3"
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
                                            />
                                        </div>

                                        <div className="flex gap-3 pt-6 border-t-2 border-gray-200">
                                            <button
                                                onClick={handleSave}
                                                disabled={isSaving}
                                                className="flex-1 bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition font-semibold text-lg disabled:bg-blue-300"
                                            >
                                                {isSaving ? 'Saving...' : '💾 Save Card'}
                                            </button>
                                            <button
                                                onClick={resetForm}
                                                className="flex-1 bg-gray-300 text-gray-800 px-6 py-3 rounded-lg hover:bg-gray-400 transition font-semibold text-lg"
                                            >
                                                🔄 Clear
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {isLoadingCards && (
                            <div className="mt-12 text-center text-gray-500">Loading saved cards...</div>
                        )}

                        {!isLoadingCards && savedCards.length > 0 && (
                            <div className="mt-12">
                                <div className="bg-white rounded-lg shadow-lg p-8">
                                    <h2 className="text-2xl font-bold text-gray-900 mb-6">📇 Saved Cards ({savedCards.length})</h2>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                        {savedCards.map((card) => (
                                            <div key={card.id} className="border border-gray-300 rounded-lg overflow-hidden hover:shadow-lg transition bg-gray-50">
                                                {card.image && (
                                                    <img src={card.image} alt={card.name} className="w-full h-40 object-cover" />
                                                )}
                                                <div className="p-4">
                                                    <h3 className="font-bold text-gray-900">{card.name}</h3>
                                                    {card.designation && <p className="text-xs text-gray-600">{card.designation}</p>}
                                                    {card.companyName && <p className="text-xs text-blue-600 font-medium">{card.companyName}</p>}
                                                    {card.email && <p className="text-xs text-gray-600 truncate">{card.email}</p>}
                                                    {card.phone1 && <p className="text-xs text-gray-600">{card.phone1}</p>}

                                                    <div className="flex gap-2 mt-3">
                                                        <button
                                                            onClick={() => handleLoadCard(card)}
                                                            className="flex-1 bg-blue-600 text-white px-3 py-2 rounded text-xs hover:bg-blue-700 font-medium"
                                                        >
                                                            ✏️ Edit
                                                        </button>
                                                        <button
                                                            onClick={() => handleDelete(card.id)}
                                                            className="flex-1 bg-red-600 text-white px-3 py-2 rounded text-xs hover:bg-red-700 font-medium"
                                                        >
                                                            🗑️ Delete
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        ReactDOM.render(<BusinessCardManager />, document.getElementById('root'));
    </script>
</body>
</html>
